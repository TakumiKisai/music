<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deltarune Piano Collections Vol.1</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
display:flex;
justify-content:center;
padding:18px;
font-family:'Inter',sans-serif;
overflow-x:hidden;
min-height:100vh;
}

/* BACKGROUND */

body::before{
content:'';
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
radial-gradient(circle at top left, rgba(255,255,255,.05), transparent 35%),
radial-gradient(circle at bottom right, rgba(255,255,255,.03), transparent 35%),
linear-gradient(135deg,#040404,#090909,#0d0d0d);

background-size:
32px 32px,
32px 32px,
auto,
auto,
auto;

z-index:-3;
}

body::after{
content:'';
position:fixed;
inset:0;

background:
repeating-linear-gradient(
-45deg,
transparent 0px,
transparent 24px,
rgba(255,255,255,.012) 25px,
transparent 26px
);

animation:bgMove 10s linear infinite;

z-index:-2;
}

@keyframes bgMove{
from{
transform:translateX(0);
}
to{
transform:translateX(30px);
}
}

/* WRAP */

.preview-wrap{
width:295px;
}

/* LABEL */

.sec-label{
display:flex;
align-items:center;
gap:8px;

margin-bottom:10px;

font-size:10px;
font-weight:800;
letter-spacing:2px;
text-transform:uppercase;
color:#d8d8d8;
}

.sec-label .dot{
width:9px;
height:9px;
border-radius:50%;

background:#fff;

box-shadow:
0 0 8px rgba(255,255,255,.8),
0 0 18px rgba(255,255,255,.3);

animation:dotPulse 2s infinite;
}

@keyframes dotPulse{
50%{
transform:scale(1.3);
}
}

/* CARD */

.music-card{

background:
linear-gradient(
145deg,
rgba(20,20,20,.97),
rgba(8,8,8,.99)
);

border-radius:22px;

padding:14px;

position:relative;
overflow:hidden;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 0 0 1px rgba(255,255,255,.02),
0 12px 35px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.05);
}

/* animated border */

.music-card::before{
content:'';
position:absolute;
inset:0;

border-radius:22px;
padding:1px;

background:
linear-gradient(
130deg,
rgba(255,255,255,.3),
transparent,
rgba(255,255,255,.12),
transparent,
rgba(255,255,255,.25)
);

background-size:300% 300%;

animation:borderFlow 9s linear infinite;

-webkit-mask:
linear-gradient(#fff 0 0) content-box,
linear-gradient(#fff 0 0);

-webkit-mask-composite:xor;
mask-composite:exclude;

pointer-events:none;
}

@keyframes borderFlow{
0%{
background-position:0% 50%;
}
100%{
background-position:300% 50%;
}
}

/* NOW PLAYING */

.now-playing-banner{

background:
linear-gradient(
145deg,
rgba(255,255,255,.055),
rgba(255,255,255,.015)
);

border-radius:18px;

padding:12px;

display:flex;
align-items:center;
gap:12px;

position:relative;
overflow:hidden;

margin-bottom:12px;

border:1px solid rgba(255,255,255,.08);

box-shadow:
inset 0 1px 0 rgba(255,255,255,.05),
0 8px 20px rgba(0,0,0,.35);
}

/* SHINE */

.now-playing-banner::before{
content:'';

position:absolute;
top:-100%;
left:-40%;

width:50%;
height:300%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.08),
transparent
);

transform:rotate(18deg);

animation:shineMove 5s linear infinite;
}

@keyframes shineMove{
from{
left:-60%;
}
to{
left:130%;
}
}

/* DISC */

.disc-wrap{

width:50px;
height:50px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle at 35% 35%, #fff, #999, #111);

position:relative;
flex-shrink:0;

box-shadow:
0 0 16px rgba(255,255,255,.08),
inset 0 0 10px rgba(255,255,255,.18);
}

.disc-wrap::after{
content:'';

width:10px;
height:10px;

border-radius:50%;

background:#050505;

position:absolute;

border:2px solid #999;
}

.disc-wrap.spinning{
animation:spinDisc 3s linear infinite;
}

@keyframes spinDisc{
from{
transform:rotate(0);
}
to{
transform:rotate(360deg);
}
}

/* TRACK INFO */

.track-info{
flex:1;
min-width:0;
z-index:2;
}

.track-label{

font-size:8px;
font-weight:800;
letter-spacing:2px;
text-transform:uppercase;

color:#888;

margin-bottom:4px;
}

.track-name{

font-size:12px;
font-weight:800;

color:#fff;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

text-shadow:0 0 12px rgba(255,255,255,.15);
}

/* EQ */

.eq-bars{
display:flex;
align-items:flex-end;
gap:3px;
height:16px;
z-index:2;
}

.eq-bar{
width:3px;

background:#fff;

border-radius:999px;

animation:eqBounce .7s infinite alternate;

box-shadow:0 0 8px rgba(255,255,255,.35);
}

.eq-bar:nth-child(1){
height:6px;
}

.eq-bar:nth-child(2){
height:14px;
animation-delay:.15s;
}

.eq-bar:nth-child(3){
height:9px;
animation-delay:.3s;
}

.eq-bar.paused{
animation-play-state:paused;
opacity:.4;
}

@keyframes eqBounce{
to{
height:18px;
}
}

/* PROGRESS */

.progress-track{

width:100%;
height:8px;

background:#111;

border-radius:999px;

overflow:hidden;

cursor:pointer;

border:1px solid rgba(255,255,255,.08);
}

.progress-fill{

height:100%;
width:0%;

background:
linear-gradient(
90deg,
#555,
#fff,
#888
);

border-radius:999px;

position:relative;

box-shadow:0 0 10px rgba(255,255,255,.25);
}

.progress-knob{

position:absolute;

right:-6px;
top:50%;

transform:translateY(-50%);

width:12px;
height:12px;

border-radius:50%;

background:#fff;

box-shadow:0 0 10px rgba(255,255,255,.4);
}

.time-row{

display:flex;
justify-content:space-between;

margin-top:4px;

font-size:9px;
font-weight:700;

color:#888;
}

/* CONTROLS */

.controls-row{

display:flex;
align-items:center;
gap:7px;

margin-top:12px;
margin-bottom:12px;
}

.cbtn{

width:36px;
height:36px;

border-radius:50%;

border:none;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

background:
linear-gradient(
145deg,
#1a1a1a,
#0c0c0c
);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 4px 10px rgba(0,0,0,.35),
inset 0 1px 0 rgba(255,255,255,.04);

transition:.15s ease;
}

.cbtn:hover{

transform:translateY(-2px) scale(1.03);

border-color:rgba(255,255,255,.18);

box-shadow:
0 0 15px rgba(255,255,255,.08);
}

.cbtn svg{
width:15px;
height:15px;
stroke:#fff;
}

/* PLAY BUTTON */

.cbtn.play{

width:44px;
height:44px;

background:
linear-gradient(
145deg,
#ffffff,
#a3a3a3,
#5a5a5a
);

box-shadow:
0 0 18px rgba(255,255,255,.22),
0 8px 18px rgba(0,0,0,.45);
}

.cbtn.play svg{
fill:#000;
stroke:none;
}

/* VOLUME */

.vol-row{
display:flex;
align-items:center;
margin-left:auto;
}

.vol-track{

width:65px;
height:7px;

background:#111;

border-radius:999px;

position:relative;

cursor:pointer;

border:1px solid rgba(255,255,255,.08);
}

.vol-fill{

height:100%;
width:70%;

background:
linear-gradient(
90deg,
#666,
#fff
);

border-radius:999px;
}

.vol-knob{

position:absolute;

left:calc(70% - 5px);
top:50%;

transform:translateY(-50%);

width:10px;
height:10px;

border-radius:50%;

background:#fff;
}

/* PLAYLIST */

.playlist-label{

font-size:9px;
font-weight:800;
letter-spacing:2px;
text-transform:uppercase;

color:#888;

margin-bottom:8px;
}

.playlist-scroll{

max-height:240px;

overflow-y:auto;

padding-right:3px;
}

.playlist-scroll::-webkit-scrollbar{
width:4px;
}

.playlist-scroll::-webkit-scrollbar-thumb{

background:#555;

border-radius:999px;
}

/* SONG CARD */

.playlist-item{

display:flex;
align-items:center;
gap:10px;

padding:9px 10px;

margin-bottom:6px;

border-radius:13px;

background:
linear-gradient(
145deg,
rgba(255,255,255,.025),
rgba(255,255,255,.012)
);

border:1px solid rgba(255,255,255,.06);

cursor:pointer;

transition:.15s ease;
}

.playlist-item:hover{

transform:translateY(-2px);

border-color:rgba(255,255,255,.18);

background:
linear-gradient(
145deg,
rgba(255,255,255,.06),
rgba(255,255,255,.02)
);

box-shadow:
0 0 14px rgba(255,255,255,.05);
}

.playlist-item.active{

border-color:rgba(255,255,255,.28);

background:
linear-gradient(
145deg,
rgba(255,255,255,.08),
rgba(255,255,255,.03)
);

box-shadow:
0 0 18px rgba(255,255,255,.08);
}

.pl-num{

font-size:9px;
font-weight:800;

color:#777;

min-width:18px;
}

.pl-name{

font-size:11px;
font-weight:700;

color:#fff;

overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

/* FOOTER */

.archive-footer{

margin-top:12px;

text-align:center;

font-size:9px;
font-weight:700;

letter-spacing:2px;
text-transform:uppercase;

color:#666;
}

</style>
</head>

<body>

<div class="preview-wrap">

<div class="sec-label">
<div class="dot"></div>
Playlist
</div>

<div class="music-card">

<!-- NOW PLAYING -->

<div class="now-playing-banner">

<div class="disc-wrap" id="disc"></div>

<div class="track-info">
<div class="track-label">
Now Playing
</div>

<div class="track-name" id="trackName">
Select A Track
</div>
</div>

<div class="eq-bars">
<div class="eq-bar paused"></div>
<div class="eq-bar paused"></div>
<div class="eq-bar paused"></div>
</div>

</div>

<!-- PROGRESS -->

<div class="progress-track" id="progressTrack">

<div class="progress-fill" id="progressFill">
<div class="progress-knob"></div>
</div>

</div>

<div class="time-row">
<span id="timeCur">0:00</span>
<span id="timeDur">0:00</span>
</div>

<!-- CONTROLS -->

<div class="controls-row">

<button class="cbtn" id="prevBtn">

<svg viewBox="0 0 24 24" fill="none">
<polygon points="19 20 9 12 19 4 19 20"/>
<line x1="5" y1="19" x2="5" y2="5"/>
</svg>

</button>

<button class="cbtn play" id="playBtn">

<svg id="playIcon" viewBox="0 0 24 24">
<polygon points="5 3 19 12 5 21 5 3"/>
</svg>

</button>

<button class="cbtn" id="nextBtn">

<svg viewBox="0 0 24 24" fill="none">
<polygon points="5 4 15 12 5 20 5 4"/>
<line x1="19" y1="5" x2="19" y2="19"/>
</svg>

</button>

<div class="vol-row">

<div class="vol-track" id="volTrack">
<div class="vol-fill" id="volFill"></div>
<div class="vol-knob" id="volKnob"></div>
</div>

</div>

</div>

<!-- PLAYLIST -->

<div class="playlist-label">
Deltarune Piano Collections Vol.1
</div>

<div class="playlist-scroll" id="playlist"></div>

<div class="archive-footer">
Vol.1
</div>

</div>

</div>

<audio id="audio"></audio>

<script>

const tracks=[

{
title:"The Legend",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/The%20Legend.mp3"
},

{
title:"Field of Hopes and Dreams",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/Field%20of%20Hopes%20and%20Dreams.mp3"
},

{
title:"Scarlet Forest",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/Scarlet%20Forest.mp3"
},

{
title:"Rude Buster",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/Rude%20Buster.mp3"
},

{
title:"Lancer",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/Lancer.mp3"
},

{
title:"Chaos King",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/Chaos%20King.mp3"
},

{
title:"THE WORLD REVOLVING",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/THE%20WORLD%20REVOLVING.mp3"
},

{
title:"My Castle Town",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/My%20Castle%20Town.mp3"
},

{
title:"A CYBER'S WORLD",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/acybersworld.mp3"
},

{
title:"BIG SHOT",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/BIG%20SHOT.mp3"
},

{
title:"Hip Shop",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/hipshop.mp3"
},

{
title:"Attack of the Killer Queen",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/Attack%20of%20the%20Killer%20Queen.mp3"
},

{
title:"Don't Forget",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/dontforget.mp3"
},

{
title:"Before the Story",
src:"https://raw.githubusercontent.com/TakumiKisai/music/main/Before%20the%20Story.mp3"
}

];

const audio=document.getElementById('audio');

const playlist=document.getElementById('playlist');

const playBtn=document.getElementById('playBtn');

const playIcon=document.getElementById('playIcon');

const trackName=document.getElementById('trackName');

const progressFill=document.getElementById('progressFill');

const progressTrack=document.getElementById('progressTrack');

const timeCur=document.getElementById('timeCur');

const timeDur=document.getElementById('timeDur');

const disc=document.getElementById('disc');

const eqBars=document.querySelectorAll('.eq-bar');

const volTrack=document.getElementById('volTrack');

const volFill=document.getElementById('volFill');

const volKnob=document.getElementById('volKnob');

let current=0;

/* PLAYLIST */

tracks.forEach((track,index)=>{

const item=document.createElement('div');

item.className='playlist-item';

item.innerHTML=`

<div class="pl-num">
${String(index+1).padStart(2,'0')}
</div>

<div class="pl-name">
${track.title}
</div>

`;

item.onclick=()=>loadTrack(index,true);

playlist.appendChild(item);

});

/* LOAD */

function loadTrack(index,autoplay){

current=index;

audio.src=tracks[current].src;

trackName.textContent=tracks[current].title;

document.querySelectorAll('.playlist-item').forEach((el,i)=>{

el.classList.toggle('active',i===index);

});

if(autoplay){

audio.play();

}

}

/* PLAY BUTTON */

playBtn.onclick=()=>{

if(!audio.src){

loadTrack(current,true);
return;

}

if(audio.paused){

audio.play();

}else{

audio.pause();

}

};

/* PLAY STATE */

audio.onplay=()=>{

playIcon.innerHTML=`

<rect x="6" y="4" width="4" height="16" rx="1"/>
<rect x="14" y="4" width="4" height="16" rx="1"/>

`;

disc.classList.add('spinning');

eqBars.forEach(bar=>{

bar.classList.remove('paused');

});

};

audio.onpause=()=>{

playIcon.innerHTML=`

<polygon points="5 3 19 12 5 21 5 3"/>

`;

disc.classList.remove('spinning');

eqBars.forEach(bar=>{

bar.classList.add('paused');

});

};

/* NEXT */

document.getElementById('nextBtn').onclick=()=>{

current=(current+1)%tracks.length;

loadTrack(current,true);

};

/* PREV */

document.getElementById('prevBtn').onclick=()=>{

current=(current-1+tracks.length)%tracks.length;

loadTrack(current,true);

};

/* PROGRESS */

audio.ontimeupdate=()=>{

if(!audio.duration)return;

const pct=(audio.currentTime/audio.duration)*100;

progressFill.style.width=pct+'%';

timeCur.textContent=format(audio.currentTime);

timeDur.textContent=format(audio.duration);

};

progressTrack.onclick=(e)=>{

const rect=progressTrack.getBoundingClientRect();

const pct=(e.clientX-rect.left)/rect.width;

audio.currentTime=pct*audio.duration;

};

/* VOLUME */

audio.volume=.7;

volTrack.onclick=(e)=>{

const rect=volTrack.getBoundingClientRect();

const pct=(e.clientX-rect.left)/rect.width;

audio.volume=pct;

volFill.style.width=(pct*100)+'%';

volKnob.style.left=`calc(${pct*100}% - 5px)`;

};

/* FORMAT */

function format(s){

const m=Math.floor(s/60);

const sec=Math.floor(s%60).toString().padStart(2,'0');

return `${m}:${sec}`;

}

</script>

</body>
</html>

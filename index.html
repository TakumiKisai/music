<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deltarune Piano Collections Vol.1</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
display:flex;
justify-content:center;
padding:20px;
font-family:'Inter',sans-serif;
overflow-x:hidden;
}

/* BACKGROUND */

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(255,255,255,.04),transparent 25%),
radial-gradient(circle at 80% 30%,rgba(255,255,255,.03),transparent 30%),
linear-gradient(135deg,#050505,#0a0a0a,#111111);
z-index:-3;
}

body::after{
content:'';
position:fixed;
inset:0;
background:
repeating-linear-gradient(
90deg,
transparent 0px,
transparent 40px,
rgba(255,255,255,.015) 41px,
transparent 42px
);
animation:bgShift 12s linear infinite;
z-index:-2;
}

@keyframes bgShift{
from{transform:translateX(0);}
to{transform:translateX(40px);}
}

/* WRAP */

.preview-wrap{
width:300px;
}

/* LABEL */

.sec-label{
display:flex;
align-items:center;
gap:10px;
font-size:11px;
font-weight:800;
letter-spacing:2px;
text-transform:uppercase;
color:#d4d4d4;
margin-bottom:10px;
}

.sec-label .dot{
width:10px;
height:10px;
border-radius:50%;
background:#fff;
box-shadow:
0 0 8px rgba(255,255,255,.8),
0 0 18px rgba(255,255,255,.4);
animation:pulseDot 2s infinite;
}

@keyframes pulseDot{
0%,100%{transform:scale(1);}
50%{transform:scale(1.3);}
}

/* CARD */

.music-card{
background:
linear-gradient(
145deg,
rgba(20,20,20,.96),
rgba(8,8,8,.98)
);

border-radius:24px;
padding:16px;

border:1px solid rgba(255,255,255,.08);

position:relative;
overflow:hidden;

backdrop-filter:blur(12px);

box-shadow:
0 0 0 1px rgba(255,255,255,.03),
0 10px 40px rgba(0,0,0,.65),
inset 0 1px 0 rgba(255,255,255,.05);
}

/* animated border */

.music-card::before{
content:'';
position:absolute;
inset:0;
padding:1px;
border-radius:24px;

background:
linear-gradient(
130deg,
rgba(255,255,255,.4),
transparent,
rgba(255,255,255,.15),
transparent,
rgba(255,255,255,.35)
);

background-size:300% 300%;
animation:borderFlow 10s linear infinite;

-webkit-mask:
linear-gradient(#fff 0 0) content-box,
linear-gradient(#fff 0 0);

-webkit-mask-composite:xor;
mask-composite:exclude;

pointer-events:none;
}

@keyframes borderFlow{
0%{background-position:0% 50%;}
100%{background-position:300% 50%;}
}

/* NOW PLAYING */

.now-playing-banner{
background:
linear-gradient(
145deg,
rgba(255,255,255,.06),
rgba(255,255,255,.02)
);

border:1px solid rgba(255,255,255,.08);

border-radius:20px;
padding:14px;

display:flex;
align-items:center;
gap:14px;

position:relative;
overflow:hidden;

margin-bottom:14px;

box-shadow:
inset 0 1px 0 rgba(255,255,255,.06),
0 10px 20px rgba(0,0,0,.35);
}

/* shine */

.now-playing-banner::before{
content:'';
position:absolute;
top:-100%;
left:-40%;
width:60%;
height:300%;

background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.08),
transparent
);

transform:rotate(18deg);

animation:shineMove 5s linear infinite;
}

@keyframes shineMove{
from{left:-60%;}
to{left:130%;}
}

/* DISC */

.disc-wrap{
width:58px;
height:58px;
border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle at 35% 35%,#fff,#999,#111);

position:relative;
flex-shrink:0;

box-shadow:
0 0 20px rgba(255,255,255,.08),
inset 0 0 10px rgba(255,255,255,.2);
}

.disc-wrap::after{
content:'';
width:12px;
height:12px;
border-radius:50%;
background:#050505;
position:absolute;
border:2px solid #aaa;
}

.disc-wrap.spinning{
animation:spinDisc 3s linear infinite;
}

@keyframes spinDisc{
from{transform:rotate(0);}
to{transform:rotate(360deg);}
}

/* TRACK INFO */

.track-info{
flex:1;
min-width:0;
position:relative;
z-index:2;
}

.track-label{
font-size:9px;
letter-spacing:2px;
text-transform:uppercase;
color:#888;
margin-bottom:4px;
font-weight:800;
}

.track-name{
font-size:13px;
font-weight:800;
color:#fff;
text-shadow:0 0 12px rgba(255,255,255,.15);

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* EQ */

.eq-bars{
display:flex;
align-items:flex-end;
gap:3px;
height:18px;
z-index:2;
}

.eq-bar{
width:4px;
background:#fff;
border-radius:999px;
animation:eqBounce .7s infinite alternate;
box-shadow:0 0 10px rgba(255,255,255,.4);
}

.eq-bar:nth-child(1){height:7px;}
.eq-bar:nth-child(2){height:15px;animation-delay:.15s;}
.eq-bar:nth-child(3){height:10px;animation-delay:.3s;}

.eq-bar.paused{
animation-play-state:paused;
opacity:.4;
}

@keyframes eqBounce{
to{height:18px;}
}

/* PROGRESS */

.progress-track{
width:100%;
height:10px;
background:#111;
border-radius:999px;
overflow:hidden;
cursor:pointer;
border:1px solid rgba(255,255,255,.08);
}

.progress-fill{
height:100%;
width:0%;
background:
linear-gradient(
90deg,
#444,
#fff,
#777
);

border-radius:999px;
position:relative;

box-shadow:0 0 12px rgba(255,255,255,.3);
}

.progress-knob{
position:absolute;
right:-7px;
top:50%;
transform:translateY(-50%);

width:14px;
height:14px;
border-radius:50%;
background:#fff;
box-shadow:0 0 10px rgba(255,255,255,.5);
}

.time-row{
display:flex;
justify-content:space-between;
font-size:10px;
font-weight:700;
margin-top:5px;
color:#999;
}

/* CONTROLS */

.controls-row{
display:flex;
align-items:center;
gap:8px;
margin-top:14px;
margin-bottom:14px;
}

.cbtn{
width:38px;
height:38px;
border-radius:50%;
border:none;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

background:
linear-gradient(
145deg,
#1a1a1a,
#0d0d0d
);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 4px 12px rgba(0,0,0,.4),
inset 0 1px 0 rgba(255,255,255,.04);

transition:.18s ease;
}

.cbtn:hover{
transform:translateY(-2px) scale(1.04);
border-color:rgba(255,255,255,.18);
}

.cbtn svg{
width:16px;
height:16px;
stroke:#fff;
}

/* PLAY BUTTON */

.cbtn.play{
width:48px;
height:48px;

background:
linear-gradient(
145deg,
#ffffff,
#9d9d9d,
#4d4d4d
);

box-shadow:
0 0 25px rgba(255,255,255,.25),
0 8px 20px rgba(0,0,0,.5);
}

.cbtn.play svg{
fill:#000;
stroke:none;
}

/* VOLUME */

.vol-row{
display:flex;
align-items:center;
gap:8px;
margin-left:auto;
}

.vol-track{
width:70px;
height:8px;
background:#111;
border-radius:999px;
position:relative;
cursor:pointer;
border:1px solid rgba(255,255,255,.08);
}

.vol-fill{
height:100%;
width:70%;
background:linear-gradient(90deg,#555,#fff);
border-radius:999px;
}

.vol-knob{
position:absolute;
left:calc(70% - 6px);
top:50%;
transform:translateY(-50%);

width:12px;
height:12px;
border-radius:50%;
background:#fff;
}

/* PLAYLIST */

.playlist-label{
font-size:10px;
font-weight:800;
letter-spacing:2px;
text-transform:uppercase;
color:#888;
margin-bottom:10px;
}

.playlist-scroll{
max-height:220px;
overflow-y:auto;
padding-right:4px;
}

.playlist-scroll::-webkit-scrollbar{
width:5px;
}

.playlist-scroll::-webkit-scrollbar-thumb{
background:#555;
border-radius:999px;
}

.playlist-item{
display:flex;
align-items:center;
gap:10px;

padding:10px 12px;
margin-bottom:7px;

border-radius:14px;

background:
linear-gradient(
145deg,
rgba(255,255,255,.03),
rgba(255,255,255,.015)
);

border:1px solid rgba(255,255,255,.06);

cursor:pointer;
transition:.16s ease;
}

.playlist-item:hover{
transform:translateY(-2px);
border-color:rgba(255,255,255,.15);
background:
linear-gradient(
145deg,
rgba(255,255,255,.07),
rgba(255,255,255,.03)
);
}

.playlist-item.active{
border-color:rgba(255,255,255,.3);

box-shadow:
0 0 18px rgba(255,255,255,.08);
}

.pl-num{
font-size:10px;
font-weight:800;
color:#777;
min-width:20px;
}

.pl-name{
font-size:12px;
font-weight:700;
color:#fff;

overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

/* FOOTER */

.archive-footer{
margin-top:14px;
text-align:center;
font-size:10px;
font-weight:700;
color:#666;
letter-spacing:2px;
text-transform:uppercase;
}

</style>
</head>

<body>

<div class="preview-wrap">

<div class="sec-label">
<div class="dot"></div>
Playlist
</div>

<div class="music-card">

<!-- NOW PLAYING -->

<div class="now-playing-banner">

<div class="disc-wrap" id="disc"></div>

<div class="track-info">
<div class="track-label">Now Playing</div>
<div class="track-name" id="trackName">Select A Track</div>
</div>

<div class="eq-bars">
<div class="eq-bar paused"></div>
<div class="eq-bar paused"></div>
<div class="eq-bar paused"></div>
</div>

</div>

<!-- PROGRESS -->

<div class="progress-track" id="progressTrack">
<div class="progress-fill" id="progressFill">
<div class="progress-knob"></div>
</div>
</div>

<div class="time-row">
<span id="timeCur">0:00</span>
<span id="timeDur">0:00</span>
</div>

<!-- CONTROLS -->

<div class="controls-row">

<button class="cbtn" id="prevBtn">

<svg viewBox="0 0 24 24" fill="none">
<polygon points="19 20 9 12 19 4 19 20"/>
<line x1="5" y1="19" x2="5" y2="5"/>
</svg>

</button>

<button class="cbtn play" id="playBtn">

<svg id="playIcon" viewBox="0 0 24 24">
<polygon points="5 3 19 12 5 21 5 3"/>
</svg>

</button>

<button class="cbtn" id="nextBtn">

<svg viewBox="0 0 24 24" fill="none">
<polygon points="5 4 15 12 5 20 5 4"/>
<line x1="19" y1="5" x2="19" y2="19"/>
</svg>

</button>

<div class="vol-row">

<div class="vol-track" id="volTrack">
<div class="vol-fill" id="volFill"></div>
<div class="vol-knob" id="volKnob"></div>
</div>

</div>

</div>

<!-- PLAYLIST -->

<div class="playlist-label">
Deltarune Piano Collections
</div>

<div class="playlist-scroll" id="playlist"></div>

<div class="archive-footer">
Vol.1
</div>

</div>

</div>

<audio id="audio"></audio>

<script>

const tracks=[

{
title:"The Legend",
src:"https://github.com/TakumiKisai/music/blob/main/The%20Legend.mp3"
},

{
title:"Field of Hopes and Dreams",
src:"https://github.com/TakumiKisai/music/blob/main/Field%20of%20Hopes%20and%20Dreams.mp3"
},

{
title:"Scarlet Forest",
src:"https://github.com/TakumiKisai/music/blob/main/Scarlet%20Forest.mp3"
},

{
title:"Rude Buster",
src:"https://github.com/TakumiKisai/music/blob/main/Rude%20Buster.mp3"
},

{
title:"Lancer",
src:"https://github.com/TakumiKisai/music/blob/main/Lancer.mp3"
},

{
title:"Chaos King",
src:"https://github.com/TakumiKisai/music/blob/main/Chaos%20King.mp3"
},

{
title:"THE WORLD REVOLVING",
src:"https://github.com/TakumiKisai/music/blob/main/THE%20WORLD%20REVOLVING.mp3"
},

{
title:"My Castle Town",
src:"https://github.com/TakumiKisai/music/blob/main/My%20Castle%20Town.mp3"
},

{
title:"A CYBER'S WORLD",
src:"https://github.com/TakumiKisai/music/blob/main/acybersworld.mp3"
},

{
title:"BIG SHOT",
src:"https://github.com/TakumiKisai/music/blob/main/BIG%20SHOT.mp3"
},

{
title:"Hip Shop",
src:"https://github.com/TakumiKisai/music/blob/main/hipshop.mp3"
},

{
title:"Attack of the Killer Queen",
src:"https://github.com/TakumiKisai/music/blob/main/Attack%20of%20the%20Killer%20Queen.mp3"
},

{
title:"Don't Forget",
src:"https://github.com/TakumiKisai/music/blob/main/Don't%20Forget.mp3"
},

{
title:"Before the Story",
src:"https://github.com/TakumiKisai/music/blob/main/Before%20the%20Story.mp3"
}

];

const audio=document.getElementById('audio');

const playlist=document.getElementById('playlist');

const playBtn=document.getElementById('playBtn');

const playIcon=document.getElementById('playIcon');

const trackName=document.getElementById('trackName');

const progressFill=document.getElementById('progressFill');

const progressTrack=document.getElementById('progressTrack');

const timeCur=document.getElementById('timeCur');

const timeDur=document.getElementById('timeDur');

const disc=document.getElementById('disc');

const eqBars=document.querySelectorAll('.eq-bar');

const volTrack=document.getElementById('volTrack');

const volFill=document.getElementById('volFill');

const volKnob=document.getElementById('volKnob');

let current=0;

/* PLAYLIST */

tracks.forEach((track,index)=>{

const item=document.createElement('div');

item.className='playlist-item';

item.innerHTML=`

<div class="pl-num">${String(index+1).padStart(2,'0')}</div>

<div class="pl-name">${track.title}</div>

`;

item.onclick=()=>loadTrack(index,true);

playlist.appendChild(item);

});

/* LOAD */

function loadTrack(index,autoplay){

current=index;

audio.src=tracks[current].src;

trackName.textContent=tracks[current].title;

document.querySelectorAll('.playlist-item').forEach((el,i)=>{

el.classList.toggle('active',i===index);

});

if(autoplay){

audio.play();

}

}

/* PLAY */

playBtn.onclick=()=>{

if(!audio.src){

loadTrack(current,true);

return;

}

if(audio.paused){

audio.play();

}else{

audio.pause();

}

};

/* PLAY STATE */

audio.onplay=()=>{

playIcon.innerHTML=`

<rect x="6" y="4" width="4" height="16" rx="1"/>
<rect x="14" y="4" width="4" height="16" rx="1"/>

`;

disc.classList.add('spinning');

eqBars.forEach(bar=>bar.classList.remove('paused'));

};

audio.onpause=()=>{

playIcon.innerHTML=`

<polygon points="5 3 19 12 5 21 5 3"/>

`;

disc.classList.remove('spinning');

eqBars.forEach(bar=>bar.classList.add('paused'));

};

/* NEXT */

document.getElementById('nextBtn').onclick=()=>{

current=(current+1)%tracks.length;

loadTrack(current,true);

};

/* PREV */

document.getElementById('prevBtn').onclick=()=>{

current=(current-1+tracks.length)%tracks.length;

loadTrack(current,true);

};

/* PROGRESS */

audio.ontimeupdate=()=>{

if(!audio.duration)return;

const pct=(audio.currentTime/audio.duration)*100;

progressFill.style.width=pct+'%';

timeCur.textContent=format(audio.currentTime);

timeDur.textContent=format(audio.duration);

};

progressTrack.onclick=(e)=>{

const rect=progressTrack.getBoundingClientRect();

const pct=(e.clientX-rect.left)/rect.width;

audio.currentTime=pct*audio.duration;

};

/* VOLUME */

audio.volume=.7;

volTrack.onclick=(e)=>{

const rect=volTrack.getBoundingClientRect();

const pct=(e.clientX-rect.left)/rect.width;

audio.volume=pct;

volFill.style.width=(pct*100)+'%';

volKnob.style.left=`calc(${pct*100}% - 6px)`;

};

/* FORMAT */

function format(s){

const m=Math.floor(s/60);

const sec=Math.floor(s%60).toString().padStart(2,'0');

return `${m}:${sec}`;

}

</script>

</body>
</html>
